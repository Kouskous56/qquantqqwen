name: repro
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt 'transformers>=4.55'
      - run: python -m pytest tests/test_pruning_runtime.py -q
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Committed aggregates match recomputation
        run: |
          python reproduce/rescore_v3.py --manifest-dir manifests \
            --questions data/v2/questions.json \
            --out-results /tmp/v3_recomputed.csv \
            --out-manifest /tmp/v33_recomputed.json
          diff /tmp/v3_recomputed.csv results/v3_cross_scale.csv
      - name: Frozen Math50 V4 migration matches recomputation
        run: |
          python -m reproduce.rescore_suite_v4 --out-dir /tmp/math50-v4-audit
          diff /tmp/math50-v4-audit/migration.json results/v4_migration/migration.json
          diff /tmp/math50-v4-audit/MIGRATION.md results/v4_migration/MIGRATION.md
      - name: Math50 4.0.1 migration matches recomputation
        run: |
          python -m reproduce.rescore_suite_v401 --out-dir /tmp/math50-v401-audit
          diff /tmp/math50-v401-audit/migration.json results/v4_0_1_migration/migration.json
          diff /tmp/math50-v401-audit/MIGRATION.md results/v4_0_1_migration/MIGRATION.md
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: recomputed-results
          path: /tmp/v3_recomputed.csv

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install check-jsonschema
      - name: Validate canonical V3 manifests
        run: check-jsonschema --schemafile schemas/manifest.schema.json manifests/RUN_V31_*.json manifests/RUN_V33_RESCORE.json
      - name: Validate Qwen3 manifests (v2)
        run: check-jsonschema --schemafile schemas/manifest.qwen3.v2.schema.json manifests_qwen3/RUN_*.json
      - name: Legacy manifests must stay valid JSON
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('manifests/**/*.json', recursive=True)]; print('all JSON valid')"

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking: repo currently contains almost no external URLs;
    # this job guards future docs edits without failing the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --no-progress --verbose --exclude '^https://arxiv\.org' './**/*.md'
